name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    env:
      PROVIDER_MODE: mock
      STORE_MODE: mock
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test

  smoke-test:
    runs-on: ubuntu-latest
    needs: lint-and-test
    env:
      PROVIDER_MODE: mock
      STORE_MODE: mock
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci
      - run: npm run build

      # Start the server in background
      - run: npm run start &
      - run: sleep 5

      # Health check
      - run: curl -f http://localhost:3000/health

      # Mock workflow smoke test
      - run: |
          curl -f -X POST http://localhost:3000/dev/run-daily \
            -H "Content-Type: application/json" \
            -d '{"userId": "test-user"}'

  python-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/tabpfn
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt
      # - run: pytest # uncomment when tests are added
