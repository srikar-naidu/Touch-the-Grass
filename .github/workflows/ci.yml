name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    env:
      PROVIDER_MODE: mock
      STORE_MODE: mock
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci
      - run: npm ci --prefix apps/api
      - run: npm ci --prefix apps/web
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test

  smoke-test:
    runs-on: ubuntu-latest
    needs: lint-and-test
    env:
      PROVIDER_MODE: mock
      STORE_MODE: mock
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci
      - run: npm ci --prefix apps/api
      - run: npm ci --prefix apps/web
      - run: npm run build

      # Start the server in background and retain logs for diagnostics.
      - run: nohup npm run start > /tmp/touch-grass-api.log 2>&1 &

      # Health check: allow the server up to 30 seconds to start.
      - name: Wait for API health
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/health; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/touch-grass-api.log
          exit 1

      # Mock workflow smoke test
      - run: |
          curl -f -X POST http://localhost:3000/dev/run-daily \
            -H "Content-Type: application/json" \
            -d '{"userId": "test-user"}'

  python-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/tabpfn
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt
      # - run: pytest # uncomment when tests are added
